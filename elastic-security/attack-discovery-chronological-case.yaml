# =============================================================================
# Workflow: Attack discoveries -> chronological timeline case
#
# How to use it:
#   1. Security > Attack discovery: tick the attack discoveries you want
#      (or "Select all").
#   2. "Selected N Attack discoveries" > Run workflow > pick this workflow.
#
#   It also works on ordinary detection alerts (Alerts table > Run workflow,
#   or the "Alert" tab of the Test workflow dialog): the selected alerts are
#   then put on the timeline themselves.
#
# What it does:
#   - Collects the alerts behind every selected attack discovery (plus any
#     directly selected alerts) and removes duplicates.
#   - Orders those alerts by the time the underlying event happened
#     (kibana.alert.original_time, falling back to @timestamp), not by
#     attack discovery.
#   - Creates ONE case: the description lists the selected discoveries
#     (AD-1, AD-2, ...) and a summary. The chronological timeline is posted as
#     comments, oldest event first. Each row says which discovery (AD-n) the
#     event came from.
#   - Attaches every alert to the case, so the case "Alerts" tab has them too.
#
# Limits (from Kibana Cases): 30,000 characters per description/comment,
# 1,000 alerts per case and 100 alerts per request. The constants below keep
# the workflow inside those limits.
# =============================================================================
version: "1"
name: Attack discoveries - chronological timeline case
description: >-
  Run from Attack discovery (select discoveries, then Run workflow). Merges
  the alerts behind every selected attack discovery into one timeline ordered
  by event time instead of by discovery, creates a single case with that
  timeline, and attaches the alerts to the case.
enabled: true
tags:
  - Security
  - Attack discovery
  - Cases

triggers:
  # Required for the workflow to appear in the attack discovery "Run workflow"
  # menu and to receive the selected discoveries in event.alerts.
  - type: alert

consts:
  # Timeline rows per case comment. A comment can hold 30,000 characters, and
  # 40 rows stays well under that.
  events_per_comment: 40
  # Cases accept at most 1,000 alerts per case.
  max_alerts: 1000
  case_tags:
    - attack-discovery
    - attack-timeline
  # true = closing the case also closes the attached alerts.
  sync_alert_status: false

steps:
  # ---------------------------------------------------------------------------
  # 1. event.alerts holds what was selected: attack discoveries and/or
  #    ordinary alerts. Count the discoveries and keep the selected IDs.
  # ---------------------------------------------------------------------------
  - name: read_selection
    type: data.set
    with:
      selected_ids: "${{ event.alerts | map: '_id' }}"
      discovery_count: "${{ event.alerts | where: 'kibana.alert.attack_discovery' | size }}"
      alerts_index: ".alerts-security.alerts-{{ event.spaceId | default: 'default' }}"

  # ---------------------------------------------------------------------------
  # 2. Alert IDs to put on the timeline: the alerts behind every discovery
  #    (kibana.alert.attack_discovery.alert_ids) plus the selected IDs
  #    themselves. A discovery's own ID matches nothing in the alerts index,
  #    so adding it is harmless. join/split flattens, uniq removes duplicates.
  # ---------------------------------------------------------------------------
  - name: collect_alert_ids
    type: data.set
    with:
      alert_ids: "${{ event.alerts | map: 'kibana.alert.attack_discovery.alert_ids' | compact | concat: variables.selected_ids | join: ',' | split: ',' | uniq }}"

  # ---------------------------------------------------------------------------
  # 3. Overview of those alerts: count, first/last event time, hosts, users,
  #    tactics and severities. event_time = original event time, falling back
  #    to the alert's @timestamp.
  # ---------------------------------------------------------------------------
  - name: alerts_overview
    type: elasticsearch.search
    with:
      index: "{{ variables.alerts_index }}"
      size: 0
      track_total_hits: true
      query:
        ids:
          values: "${{ variables.alert_ids }}"
      runtime_mappings:
        event_time:
          type: date
          script:
            source: >-
              if (doc.containsKey('kibana.alert.original_time') && doc['kibana.alert.original_time'].size() > 0) {
              emit(doc['kibana.alert.original_time'].value.toInstant().toEpochMilli()); } else if
              (doc['@timestamp'].size() > 0) { emit(doc['@timestamp'].value.toInstant().toEpochMilli()); }
      aggregations:
        first_event:
          min:
            field: event_time
            format: "yyyy-MM-dd HH:mm:ss.SSS"
        last_event:
          max:
            field: event_time
            format: "yyyy-MM-dd HH:mm:ss.SSS"
        severities:
          terms:
            field: kibana.alert.severity
            size: 10
        hosts:
          terms:
            field: host.name
            size: 25
        users:
          terms:
            field: user.name
            size: 25
        tactics:
          terms:
            field: kibana.alert.rule.threat.tactic.name
            size: 20

  # ---------------------------------------------------------------------------
  # 4. Work out how many timeline comments are needed.
  # ---------------------------------------------------------------------------
  - name: plan_timeline
    type: data.set
    with:
      total_alerts: "${{ steps.alerts_overview.output.hits.total.value }}"
      included_alerts: "${{ steps.alerts_overview.output.hits.total.value | at_most: consts.max_alerts }}"
      page_count: "${{ steps.alerts_overview.output.hits.total.value | at_most: consts.max_alerts | divided_by: consts.events_per_comment | ceil }}"

  # ---------------------------------------------------------------------------
  # 5. Build the case description. The regex turns attack discovery entity
  #    tokens such as "{{ host.name srv-01 }}" into plain `srv-01`.
  # ---------------------------------------------------------------------------
  - name: case_description
    type: data.regexReplace
    source: |
      {%- assign ads = event.alerts | where: 'kibana.alert.attack_discovery' -%}
      {%- assign direct_count = event.alerts.size | minus: ads.size -%}
      ## Chronological event timeline

      The {{ variables.included_alerts }} alerts behind the selection, merged into one timeline and ordered by **when each event happened**, not by attack discovery.

      | | |
      |---|---|
      | **Selected** | {{ ads.size }} attack discoveries{% if direct_count > 0 %}, {{ direct_count }} alerts{% endif %} |
      | **First event (UTC)** | {{ steps.alerts_overview.output.aggregations.first_event.value_as_string | default: 'n/a' }} |
      | **Last event (UTC)** | {{ steps.alerts_overview.output.aggregations.last_event.value_as_string | default: 'n/a' }} |
      | **Alerts** | {{ variables.total_alerts }}{% if variables.total_alerts > variables.included_alerts %} (only the first {{ variables.included_alerts }} are in this case: Cases allows {{ consts.max_alerts }} alerts per case){% endif %} |
      | **Severities** | {{ steps.alerts_overview.output.aggregations.severities.buckets | map: 'key' | join: ', ' | default: 'n/a' }} |
      | **Hosts** | {{ steps.alerts_overview.output.aggregations.hosts.buckets | map: 'key' | join: ', ' | replace: '|', '\\|' | default: 'n/a' }}{% if steps.alerts_overview.output.aggregations.hosts.sum_other_doc_count > 0 %}, ...{% endif %} |
      | **Users** | {{ steps.alerts_overview.output.aggregations.users.buckets | map: 'key' | join: ', ' | replace: '|', '\\|' | default: 'n/a' }}{% if steps.alerts_overview.output.aggregations.users.sum_other_doc_count > 0 %}, ...{% endif %} |
      | **MITRE ATT&CK tactics** | {{ steps.alerts_overview.output.aggregations.tactics.buckets | map: 'key' | join: ', ' | default: 'n/a' }} |
      {% if ads.size > 0 %}
      ### Attack discoveries in this case

      The **AD** column of the timeline refers to these numbers.
      {% for d in ads %}
      {%- assign ad = d.kibana.alert.attack_discovery %}
      **AD-{{ forloop.index }}: {{ ad.title_with_replacements | default: ad.title | strip_newlines | truncate: 200 }}** ({{ ad.alert_ids | size }} alerts{% if ad.mitre_attack_tactics != blank %}; {{ ad.mitre_attack_tactics | join: ', ' }}{% endif %})

      {{ ad.summary_markdown_with_replacements | default: ad.summary_markdown | truncate: 400 }}
      {% endfor %}
      {%- endif %}
      ### Timeline

      The timeline is posted as comments on this case, oldest event first, {{ consts.events_per_comment }} events per comment. Every alert is also attached to the case (**Alerts** tab).

      ---
      Created by the **{{ workflow.name }}** workflow (execution `{{ execution.id }}`).
    with:
      pattern: '\{\{\s*[\w.@-]+\s+([^}\n]+?)\s*\}\}'
      replacement: '`$1`'
      flags: g

  # ---------------------------------------------------------------------------
  # 6. Create the case.
  # ---------------------------------------------------------------------------
  - name: create_case
    type: cases.createCase
    with:
      owner: securitySolution
      title: >-
        {%- assign ads = event.alerts | where: 'kibana.alert.attack_discovery' -%}
        {%- if ads.size > 0 -%}
        Attack timeline: {{ ads[0].kibana.alert.attack_discovery.title_with_replacements | default: ads[0].kibana.alert.attack_discovery.title | strip_newlines | truncate: 110 }}{% if ads.size > 1 %} (+{{ ads.size | minus: 1 }} more){% endif %}
        {%- else -%}
        Alert timeline: {{ event.alerts.size }} alerts ({{ event.alerts[0].kibana.alert.rule.name | default: 'selected alerts' | strip_newlines | truncate: 100 }})
        {%- endif -%}
      description: "{{ steps.case_description.output | truncate: 29900 }}"
      severity: >-
        {%- assign sev = steps.alerts_overview.output.aggregations.severities.buckets | map: 'key' -%}
        {%- if sev contains 'critical' -%}critical{%- elsif sev contains 'high' -%}high{%- elsif sev contains 'medium' -%}medium{%- else -%}low{%- endif -%}
      tags: "${{ consts.case_tags }}"
      settings:
        syncAlerts: "${{ consts.sync_alert_status }}"

  # ---------------------------------------------------------------------------
  # 7. Post the timeline in chronological pages and attach the alerts.
  #    foreach.item is the page number (1, 2, 3, ...).
  # ---------------------------------------------------------------------------
  - name: timeline_pages
    type: foreach
    foreach: "${{ (1..variables.page_count) }}"
    steps:
      # 7a. One page of alerts, oldest event first.
      - name: timeline_page
        type: elasticsearch.search
        with:
          index: "{{ variables.alerts_index }}"
          from: "${{ foreach.item | minus: 1 | times: consts.events_per_comment }}"
          size: "${{ consts.events_per_comment }}"
          track_total_hits: false
          _source: false
          query:
            ids:
              values: "${{ variables.alert_ids }}"
          runtime_mappings:
            event_time:
              type: date
              script:
                source: >-
                  if (doc.containsKey('kibana.alert.original_time') && doc['kibana.alert.original_time'].size() > 0) {
                  emit(doc['kibana.alert.original_time'].value.toInstant().toEpochMilli()); } else if
                  (doc['@timestamp'].size() > 0) { emit(doc['@timestamp'].value.toInstant().toEpochMilli()); }
          # Plain field names sort ascending (oldest first). Kibana 9.4 only
          # accepts plain strings here, so no {order: asc} objects.
          sort:
            - event_time
            - "@timestamp"
            - kibana.alert.uuid
          fields:
            - field: event_time
              format: "yyyy-MM-dd HH:mm:ss.SSS"
            - field: kibana.alert.rule.name
            - field: kibana.alert.rule.uuid
            - field: kibana.alert.severity
            - field: kibana.alert.rule.threat.tactic.name
            - field: kibana.alert.reason
            - field: host.name
            - field: user.name
            - field: process.name
            - field: process.command_line
            - field: file.path

      # 7b. Post this page of the timeline as a case comment. The final
      #     truncate only matters if a page is full of extremely long values.
      - name: post_timeline_comment
        type: cases.addComment
        with:
          case_id: "{{ steps.create_case.output.case.id }}"
          comment: |
            {%- capture page -%}
            {%- assign ads = event.alerts | where: 'kibana.alert.attack_discovery' -%}
            {%- assign offset = foreach.item | minus: 1 | times: consts.events_per_comment -%}
            {%- assign hits = steps.timeline_page.output.hits.hits -%}
            ### Event timeline, part {{ foreach.item }} of {{ foreach.total }} (events {{ offset | plus: 1 }} to {{ offset | plus: hits.size }} of {{ variables.included_alerts }})

            | # | Time (UTC) | Host | User | Alert | Severity | Tactic | What happened | AD |
            |---:|---|---|---|---|---|---|---|---|
            {% for hit in hits -%}
            {%- assign f = hit.fields -%}
            {%- assign cmd = f['process.command_line'][0] | default: f['process.name'][0] | default: f['file.path'][0] -%}
            {%- if cmd != blank -%}
              {%- assign what = cmd | replace: '\r', '' | replace: '\n', ' ' | replace: '`', "'" | truncate: 160 | replace: '|', '\\|' | prepend: '`' | append: '`' -%}
            {%- else -%}
              {%- assign what = f['kibana.alert.reason'][0] | default: '' | replace: '\r', '' | replace: '\n', ' ' | truncate: 160 | replace: '|', '\\|' -%}
            {%- endif -%}
            {%- assign ad_refs = '' -%}
            {%- for d in ads -%}
              {%- if d.kibana.alert.attack_discovery.alert_ids contains hit._id -%}
                {%- if ad_refs != '' -%}{%- assign ad_refs = ad_refs | append: ', ' -%}{%- endif -%}
                {%- assign ad_refs = ad_refs | append: 'AD-' | append: forloop.index -%}
              {%- endif -%}
            {%- endfor -%}
            | {{ offset | plus: forloop.index }} | {{ f.event_time[0] }} | {{ f['host.name'] | join: ', ' | truncate: 60 | replace: '|', '\\|' | default: '-' }} | {{ f['user.name'] | join: ', ' | truncate: 60 | replace: '|', '\\|' | default: '-' }} | {{ f['kibana.alert.rule.name'][0] | truncate: 100 | replace: '|', '\\|' }} | {{ f['kibana.alert.severity'][0] }} | {{ f['kibana.alert.rule.threat.tactic.name'] | uniq | join: ', ' | truncate: 80 | replace: '|', '\\|' | default: '-' }} | {{ what | default: '-' }} | {{ ad_refs | truncate: 60 | default: '-' }} |
            {% endfor %}
            {%- endcapture -%}
            {{ page | truncate: 29900 }}

      # 7c. Attach this page's alerts to the case (max 100 per request).
      - name: page_alert_refs
        type: data.map
        items: "${{ steps.timeline_page.output.hits.hits }}"
        with:
          fields:
            alertId: "{{ item._id }}"
            index: "{{ item._index }}"
            rule:
              id: "{{ item.fields['kibana.alert.rule.uuid'][0] }}"
              name: "{{ item.fields['kibana.alert.rule.name'][0] }}"

      - name: attach_page_alerts
        type: cases.addAlerts
        with:
          case_id: "{{ steps.create_case.output.case.id }}"
          alerts: "${{ steps.page_alert_refs.output }}"

  # ---------------------------------------------------------------------------
  # 8. Log a link to the new case in the execution view.
  # ---------------------------------------------------------------------------
  - name: done
    type: console
    with:
      message: >-
        Created case "{{ steps.create_case.output.case.title }}" with {{ variables.included_alerts }} alerts
        from {{ variables.discovery_count }} attack discoveries and {{ event.alerts.size | minus: variables.discovery_count }} selected alerts:
        {{ kibanaUrl }}{% if event.spaceId and event.spaceId != 'default' %}/s/{{ event.spaceId }}{% endif %}/app/security/cases/{{ steps.create_case.output.case.id }}
