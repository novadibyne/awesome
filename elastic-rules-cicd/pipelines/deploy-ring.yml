# Replicate rules to every deployment and space in one ring.
#
# A deployment job binds to an ADO Environment, which is where approval gates
# live. Fan-out across deployments and spaces happens inside deploy.py
# (concurrently, --max-parallel), not as ADO matrix legs - one job keeps the
# approval gate and the whole ring's result in a single place. Per-target rows
# still show up in the pipeline UI via the published JUnit file.
#
# NOTE: deployment jobs do NOT check out the repo by default. Hence the
# explicit `checkout: self`.

parameters:
  - name: ring
    type: number
  - name: environmentName
    type: string
  - name: displayName
    type: string
  - name: pythonVersion
    type: string
    default: '3.12'
  # 'keyvault' -> deploy.py reads Key Vault directly, no per-deployment mapping
  # 'env'      -> keys come from the variable group, mapped by hand below
  - name: keySource
    type: string
    default: keyvault
  - name: azureSubscription
    type: string
    default: ''
  - name: keyVaultUrl
    type: string
    default: ''
  - name: maxParallel
    type: number
    default: 8
  # Fraction of targets allowed to fail without failing the stage. Keep 0 for
  # rings 0 and 1. For a wide ring 2, a small budget stops one unreachable
  # tenant blocking the other 200.
  - name: failThreshold
    type: string
    default: '0.0'

jobs:
  - deployment: deploy_ring_${{ parameters.ring }}
    displayName: ${{ parameters.displayName }}
    environment: ${{ parameters.environmentName }}
    pool:
      vmImage: ubuntu-latest
    variables:
      - ${{ if eq(parameters.keySource, 'env') }}:
          - group: elastic-rules-keys
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: UsePythonVersion@0
              displayName: Use Python ${{ parameters.pythonVersion }}
              inputs:
                versionSpec: ${{ parameters.pythonVersion }}

            - ${{ if eq(parameters.keySource, 'keyvault') }}:
                - script: pip install -r requirements-azure.txt
                  displayName: Install dependencies

                - task: AzureCLI@2
                  displayName: Replicate to ring ${{ parameters.ring }}
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    # az login from the service connection leaves a session
                    # that DefaultAzureCredential picks up inside deploy.py.
                    inlineScript: |
                      python scripts/deploy.py \
                        --ring ${{ parameters.ring }} \
                        --key-source keyvault \
                        --key-vault-url "${{ parameters.keyVaultUrl }}" \
                        --max-parallel ${{ parameters.maxParallel }} \
                        --fail-threshold ${{ parameters.failThreshold }} \
                        --junit-out "$(Build.ArtifactStagingDirectory)/ring-${{ parameters.ring }}-results.xml"

            - ${{ if eq(parameters.keySource, 'env') }}:
                - script: pip install -r requirements.txt
                  displayName: Install dependencies

                - script: |
                    python scripts/deploy.py \
                      --ring ${{ parameters.ring }} \
                      --max-parallel ${{ parameters.maxParallel }} \
                      --fail-threshold ${{ parameters.failThreshold }} \
                      --junit-out "$(Build.ArtifactStagingDirectory)/ring-${{ parameters.ring }}-results.xml"
                  displayName: Replicate to ring ${{ parameters.ring }}
                  # Secret variables are NOT exposed to scripts automatically.
                  # One line per DEPLOYMENT (spaces share the deployment key).
                  # This mapping is why keyvault is the default.
                  env:
                    KIBANA_APIKEY_INTERNAL_DEV: $(kibana-apikey-internal-dev)
                    KIBANA_APIKEY_ACME_PROD: $(kibana-apikey-acme-prod)
                    KIBANA_APIKEY_GLOBEX_PROD: $(kibana-apikey-globex-prod)
                    KIBANA_APIKEY_INITECH_PROD: $(kibana-apikey-initech-prod)

            # Shows one pass/fail row per deployment/space in the Tests tab.
            - task: PublishTestResults@2
              displayName: Publish per-target results
              condition: succeededOrFailed()
              inputs:
                testResultsFormat: JUnit
                testResultsFiles: '$(Build.ArtifactStagingDirectory)/ring-${{ parameters.ring }}-results.xml'
                testRunTitle: 'Ring ${{ parameters.ring }} replication'
                failTaskOnFailedTests: false
