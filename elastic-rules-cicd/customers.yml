# Tenant registry. One entry per customer environment.
#
# ring:             0 = internal canary, 1 = pilot customers, 2 = everyone else
# kibana_url:       base URL of the customer's Kibana
# space:            Kibana space id ("default" if they don't use spaces)
# api_key_env:      env var holding that tenant's Kibana API key, used by
#                   --key-source env (the default)
# key_vault_secret: Key Vault secret holding the same key, used by
#                   --key-source keyvault. Key Vault secret names allow only
#                   letters, digits and dashes - no underscores.
# index:            optional override of the index pattern for every rule
# exclude:          rule_ids this customer does not get
#
# NEVER put an actual API key in this file.

customers:
  - id: internal-dev
    ring: 0
    kibana_url: https://dev-kibana.example.internal:5601
    space: default
    api_key_env: KIBANA_APIKEY_INTERNAL_DEV
    key_vault_secret: kibana-apikey-internal-dev

  - id: acme
    ring: 1
    kibana_url: https://acme.kb.eastus.azure.elastic-cloud.com:9243
    space: default
    api_key_env: KIBANA_APIKEY_ACME
    key_vault_secret: kibana-apikey-acme
    index:
      - logs-acme-*
      - winlogbeat-acme-*

  - id: globex
    ring: 2
    kibana_url: https://globex.kb.eastus.azure.elastic-cloud.com:9243
    space: soc
    api_key_env: KIBANA_APIKEY_GLOBEX
    key_vault_secret: kibana-apikey-globex
    exclude:
      - 4f8b1c2e-6a13-4f0e-9c77-2b8d5a1e0f31
